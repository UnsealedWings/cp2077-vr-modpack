; ANR FG (Apex Neural Rendering). Restart the game after a change.
build = user
; the convolution path tried first: auto (our measured order for the GPU), coopmat, packed, dp4a (INT8), portable,
; portable-linalg or portable-xmx
path = auto
; this package has one model size
model_size = large
model_note = ANR FG
; PQ (HDR10) colors: display luminance of the model's linear 1.0, in nits
nits_per_unit = 80
; generated frames per real frame offered to the game (5: up to 6X)
max_generated = 5
; 1: no interpolation across a scene cut (a camera cut or a sudden change of the image); 0: off
scene_cut = 1
